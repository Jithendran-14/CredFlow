server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: mock-external-systems
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/credflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/credflow/protocol/openid-connect/certs}
  datasource:
    url: jdbc:h2:mem:simulator;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
credflow:
  security:
    audience: credflow-api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
logging:
  structured:
    format:
      console: logstash
