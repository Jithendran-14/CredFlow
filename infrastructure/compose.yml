name: credflow
services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.0.0-lite
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Generate .env first}
      CF_APPLICATION_PASSWORD: ${CF_APPLICATION_PASSWORD:?Generate .env first}
      CF_CONSENT_PASSWORD: ${CF_CONSENT_PASSWORD:?Generate .env first}
      CF_ELIGIBILITY_PASSWORD: ${CF_ELIGIBILITY_PASSWORD:?Generate .env first}
      CF_ORCHESTRATION_PASSWORD: ${CF_ORCHESTRATION_PASSWORD:?Generate .env first}
      CF_LENDER_INTEGRATION_PASSWORD: ${CF_LENDER_INTEGRATION_PASSWORD:?Generate .env first}
      CF_AUDIT_PASSWORD: ${CF_AUDIT_PASSWORD:?Generate .env first}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/setup:/opt/oracle/scripts/setup:ro
      - ./oracle/health.sh:/opt/credflow/health.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/opt/credflow/health.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Generate .env first}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Generate .env first}
      MARKETPLACE_CLIENT_SECRET: ${MARKETPLACE_CLIENT_SECRET:?Generate .env first}
      BANK_A_CLIENT_SECRET: ${BANK_A_CLIENT_SECRET:?Generate .env first}
      NBFC_B_CLIENT_SECRET: ${NBFC_B_CLIENT_SECRET:?Generate .env first}
      VERIFICATION_CLIENT_SECRET: ${VERIFICATION_CLIENT_SECRET:?Generate .env first}
      APPLICATION_SERVICE_CLIENT_SECRET: ${APPLICATION_SERVICE_CLIENT_SECRET:?Generate .env first}
      CONSENT_VERIFICATION_SERVICE_CLIENT_SECRET: ${CONSENT_VERIFICATION_SERVICE_CLIENT_SECRET:?Generate .env first}
      ELIGIBILITY_SERVICE_CLIENT_SECRET: ${ELIGIBILITY_SERVICE_CLIENT_SECRET:?Generate .env first}
      ORCHESTRATION_SERVICE_CLIENT_SECRET: ${ORCHESTRATION_SERVICE_CLIENT_SECRET:?Generate .env first}
      LENDER_INTEGRATION_SERVICE_CLIENT_SECRET: ${LENDER_INTEGRATION_SERVICE_CLIENT_SECRET:?Generate .env first}
      AUDIT_SERVICE_CLIENT_SECRET: ${AUDIT_SERVICE_CLIENT_SECRET:?Generate .env first}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  api-gateway:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      APPLICATION_URL: http://application-service:8081
      CONSENT_URL: http://consent-verification-service:8082
      ELIGIBILITY_URL: http://eligibility-service:8083
      ORCHESTRATION_URL: http://orchestration-service:8084
      INTEGRATION_URL: http://lender-integration-service:8085
      AUDIT_URL: http://audit-service:8086
    depends_on:
      keycloak:
        condition: service_healthy
  application-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/application-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_APPLICATION_PASSWORD: ${CF_APPLICATION_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  consent-verification-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/consent-verification-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_CONSENT_PASSWORD: ${CF_CONSENT_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  eligibility-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/eligibility-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_ELIGIBILITY_PASSWORD: ${CF_ELIGIBILITY_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  orchestration-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/orchestration-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_ORCHESTRATION_PASSWORD: ${CF_ORCHESTRATION_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  lender-integration-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/lender-integration-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_LENDER_INTEGRATION_PASSWORD: ${CF_LENDER_INTEGRATION_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
