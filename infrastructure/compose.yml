  audit-service:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: backend/audit-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
      ORACLE_JDBC_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      CF_AUDIT_PASSWORD: ${CF_AUDIT_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  mock-external-systems:
    profiles: [apps]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        MODULE: mocks/mock-external-systems
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/credflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/credflow/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
volumes:
  oracle-data:
  kafka-data:
  keycloak-data:
